<html>
    <head>
        <title>BootStrap Tutorial - grid system </title>
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-around">
                <span class="bg-info col-4 m-1">grid-1</span>
                <span class="bg-warning col-3 m-1 ">grid-2</span>
                <span class="bg-danger col-3 m-1">grid-3</span>                
            </div>
            <div class="row m-1">
                <span class="bg-info col-md-5 col-sm-3 m-1">grid-1</span>
                <span class="bg-warning col-md-3 col-sm-3 m-1">grid-2</span>
                <span class="bg-danger col-md-3 col-sm-3 m-1">grid-3</span>                
            </div>
        </div>
    </body>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</html>
